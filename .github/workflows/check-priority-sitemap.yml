name: Check priority sitemap

on:
  push:
    paths:
      - '.github/workflows/check-priority-sitemap.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify priority sitemap
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.daycaresignal.com/sitemap-priority.xml'
          curl --fail --silent --show-error --location "$url" -o /tmp/sitemap-priority.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' /tmp/sitemap-priority.xml
          grep -Fq 'https://www.daycaresignal.com/mb/winnipeg/infant' /tmp/sitemap-priority.xml
          grep -Fq 'https://www.daycaresignal.com/bc/vancouver/infant' /tmp/sitemap-priority.xml
          grep -Fq 'https://www.daycaresignal.com/on/toronto/infant' /tmp/sitemap-priority.xml
          echo PRIORITY_SITEMAP_OK
