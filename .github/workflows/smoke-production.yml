name: Smoke test Daycare Signal production

on:
  push:
    paths:
      - ".github/workflows/smoke-production.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production API configuration
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          STATUS="$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST 'https://www.daycaresignal.com/api/subscribe' \
            -H 'content-type: application/json' \
            --data '{}')"
          echo "subscribe_status=$STATUS"
          cat "$BODY"
          echo
          if [ "$STATUS" = "503" ]; then
            echo "::error::Production API reports email alerts are not configured."
            exit 1
          fi
          if [ "$STATUS" != "400" ] && [ "$STATUS" != "422" ]; then
            echo "::error::Unexpected subscribe status: $STATUS"
            exit 1
          fi
          echo "Production API has RESEND_API_KEY available; invalid payload was rejected before any email/contact action."
